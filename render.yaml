services:
  - type: web
    runtime: static
    name: TRANSITREACH_SHENZHEN-1
    repo: https://github.com/Jethro5977/TRANSITREACH_SHENZHEN
    branch: main
    buildCommand: npm ci && npm run verify
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
