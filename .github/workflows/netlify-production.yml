name: Deploy TransitReach Shenzhen

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  trigger-netlify:
    name: Trigger production build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the protected Netlify build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$NETLIFY_BUILD_HOOK_URL"
